# Topaz Al2SiO4F2, space group 62 (Pnma). Orthorhombic (3 lattice
# params). Generalisation check for MULTIPLE anion species (see the
# mizuho-py-wychoff-position plan's Phase B-2 section, and the
# discussion that led to narrow_constraint_groups being decomposed by
# constraint BREADTH rather than cation/anion role): Al is coordinated
# by a MIX of O and F (an octahedron drawing from two anion species at
# once), while Si is coordinated by O only -- a genuinely different,
# asymmetric coupling shape from Adamite's single-anion (O) case and
# spinel's single-anion (O) case.
#
# Charge balance: 2*Al(+3) + Si(+4) + 4*O(-2) + 2*F(-1)
#               = 6 + 4 - 8 - 2 = 0.
composition: Al2SiO4F2
spacegroup: 62
spacegroup_symbol: Pnma

ionic_charges:
  Al: 3
  Si: 4
  O: -2
  F: -1

charge_tolerance_min: 0
charge_tolerance_max: 0

lattice_bounds:
  # Natural topaz (Handbook of Mineralogy, Mineral Data Publishing 2001):
  # Pbnm a=4.6499(3) b=8.7968(6) c=8.3909(5). mizuho's SG62 data is
  # verified (see mizuho.data.get_ops(62)) to be genuine Pnma (n-glide
  # perp a, mirror perp b, a-glide perp c), and Pnma/Pbnm axes relate by
  # a_Pnma=b_Pbnm, b_Pnma=c_Pbnm, c_Pnma=a_Pbnm -- so in THIS fixture's
  # a/b/c (Pnma), the experimental targets are a~8.80, b~8.39, c~4.65.
  a: [7.6, 9.2]
  b: [8.0, 9.6]
  c: [4.0, 5.3]

bond_constraints:
  - atom1: Al
    atom2: O
    # Band: reference span 1.885-1.902 A widened by 2% (ADR-0007; phase E).
    distance_min: 1.84
    distance_max: 1.95
    # Measured at tests/fixtures/reference/topaz.cif (ADR-0004):
    # Al first shell ends 1.902 A, second starts 3.325 A.
    cutoff: 2.613
    weight: 1.0
  - atom1: Al
    atom2: F
    # Band: reference span 1.790-1.801 A widened by 2% (ADR-0007; phase E).
    distance_min: 1.75
    distance_max: 1.84
    # Measured at tests/fixtures/reference/topaz.cif (ADR-0004):
    # Al first shell ends 1.902 A, second starts 3.325 A.
    cutoff: 2.613
    weight: 1.0
  - atom1: Si
    atom2: O
    # Band: reference span 1.636-1.642 A widened by 2% (ADR-0007; phase E).
    distance_min: 1.60
    distance_max: 1.68
    # Measured at tests/fixtures/reference/topaz.cif (ADR-0004):
    # Si first shell ends 1.642 A, second starts 3.229 A.
    cutoff: 2.436
    weight: 1.0

angle_constraints:
  - atom_center: Al
    atom_neighbor: [O, F]
    angle_min: 78.0
    angle_max: 102.0
    weight: 1.0
  - atom_center: Si
    atom_neighbor: O
    angle_min: 100.0
    angle_max: 120.0
    weight: 1.5

coordination_constraints:
  # Stated explicitly rather than left to augment_coupling_constraints,
  # whose cutoff (max bond distance_max) sits only ~0.15 A past the real
  # bond and leaves the logistic soft count unsaturated. Measured at the
  # reference structure (ADR-0004).
  - center_atom: O
    neighbor_atom: X
    cn_min: 2
    cn_max: 4
    cutoff_distance: 2.566
    weight: 1.0
  - center_atom: F
    neighbor_atom: X
    cn_min: 2
    cn_max: 4
    cutoff_distance: 2.445
    weight: 1.0

  - center_atom: Al
    neighbor_atom: [O, F]
    cn_min: 6
    cn_max: 6
    # Measured at the reference structure (ADR-0004).
    cutoff_distance: 2.613
    weight: 1.5
  - center_atom: Si
    neighbor_atom: O
    cn_min: 4
    cn_max: 4
    # Measured at the reference structure (ADR-0004).
    cutoff_distance: 2.436
    weight: 1.5
  # Polymerisation (phase C): isolated SiO4 tetrahedra, each of the 16 O
  # bonds exactly one Si ({1: 16} measured).
  - center_atom: O
    neighbor_atom: Si
    cn_min: 1
    cn_max: 1
    cutoff_distance: 2.436
    weight: 1.0

# Cutoffs for the auto X-O-X / X-F-X angle constraints, which phase B now
# injects beside the explicit O(X) / F(X) coordination constraints: the
# same measured anion cutoffs (ADR-0004).
auto_coupling_cutoff: {O: 2.566, F: 2.445}

# All fields auto-computed from composition via the Hazen-type additive
# volume rule (V_est=407.5 A^3 here, band [326.0,590.9]). Note (see the
# mizuho-py-wychoff-position plan's phase I-3): this alone does NOT fix
# the wide-lattice_bounds degenerate-shape failure mode observed on
# this fixture (a flat a=18/b=30/c=1-type cell can have a "reasonable"
# total volume while being the wrong shape entirely) -- kept anyway
# since it is harmless and does help on other fixtures (e.g. adamite),
# and volume + a future shape-aware term are meant to be complementary,
# not alternatives.
# Cell volume from the measured density, D(meas.) = 3.49–3.57 g/cm^3 (Handbook of
# Mineralogy, Anthony et al., eds., Mineralogical Society of America;
# references/topaz.pdf): V = Z M / (rho N_A) with Z = 4, M(Al2SiO4F2) from IUPAC 2021
# atomic weights (scripts/density_to_volume.py). D(calc.) is not used.
volume_constraint:
  volume_min: 342.41
  volume_max: 350.27
# Bond-valence sums (Brese & O'Keeffe 1991 R0, b = 0.37 A; design review
# 2026-10-01). The cited 0.1 v.u. tolerance is exceeded at this fixture's own
# reference, so it is replaced by the measured deviation rounded outward
# (ADR-0004's amendment): Si 0.167.
bond_valence:
  tolerance: {Si: 0.17}

tree_search:
  max_sites: 9
  max_formula_units: 4
  # ~3,200 total candidates (measured) -- the default shortlist
  # (min(4*max_cands,2000)) would hand ~2000 of them to the expensive
  # STAGE-2 joint {Al,Si,O,F} solve; capped tighter here to keep a
  # verification run practical.
  feasibility_shortlist: 60

optimization:
  n_restarts: 8
  cma_maxiter: 300
  refine_maxiter: 400
  seed: 42
