# Rock salt NaCl, space group 225 (Fm-3m).
# Simplest possible case: cubic (1 lattice param), zero free Wyckoff
# parameters (Na@4a, Cl@4b are both fully symmetry-fixed).
composition: NaCl
spacegroup: 225
spacegroup_symbol: Fm-3m

ionic_charges:
  Na: 1
  Cl: -1

charge_tolerance_min: 0
charge_tolerance_max: 0

lattice_bounds:
  a: [4.5, 6.5]

bond_constraints:
  - atom1: Na
    atom2: Cl
    distance_min: 2.5
    distance_max: 3.2
    weight: 1.0

tree_search:
  max_sites: 4
  max_formula_units: 4

optimization:
  n_restarts: 2
  cma_maxiter: 50
  refine_maxiter: 100
  seed: 42
