# Adamite Zn2(AsO4)(OH), space group 58 (Pnnm). Orthorhombic (3 lattice
# params). This is the mineral that originally motivated the whole
# mizuho-py-wychoff-position generalisation plan (Phase A-D, B-2, B-3):
# with wyckoff_assignment supplied directly, a good structure (error
# 8.42) was reachable, but fully automatic discovery (composition +
# bonding constraints + space group only) could not find it -- Zn must
# split across TWO distinct 4-fold Wyckoff sites and O across THREE
# distinct sites to reach the real Z=4 cell (see
# tests/unit/test_ratio_consistency.py's module docstring), a topology
# best-first search's original surrogate_score buried tens of thousands
# of candidates deep. This fixture is the final gate: no
# wyckoff_assignment, fully automatic, at the SAME combinatorial scale
# as the original investigation (max_sites=9, max_formula_units=4 ->
# 69,974 total candidates).
#
# Charge balance: 2*Zn(+2) + As(+5) + 5*O(-2) + H(+1)
#               = 4 + 5 - 10 + 1 = 0.
composition: O5Zn2AsH
spacegroup: 58
spacegroup_symbol: Pnnm

ionic_charges:
  Zn: 2
  As: 5
  O: -2
  H: 1

charge_tolerance_min: 0
charge_tolerance_max: 0

lattice_bounds:
  a: [7.8, 8.8]
  b: [8.0, 9.0]
  c: [5.6, 6.5]

# Reference structure: tests/fixtures/reference/adamite_aflow_icsd34868.cif,
# AFLOW's DFT-relaxed structure of ICSD 34868, the first adamite reference
# with its hydrogen located (ADR-0025). It replaces the 1937 refinement
# (COD 1010925), whose undetermined H had switched the charge term off and
# whose As-O spread (1.588-1.814 A) had widened every band below. Cutoffs
# are the midpoint of the first/second shell gap (ADR-0004); bond bands are
# the reference span widened by 2% and rounded outward (ADR-0007).

bond_constraints:
  - atom1: As
    atom2: O
    # Reference span 1.719-1.728 A.
    distance_min: 1.68
    distance_max: 1.77
    # As-O first shell ends 1.728 A, second starts 3.142 A.
    cutoff: 2.435
  - atom1: Zn
    atom2: O
    # Reference span 1.984-2.238 A.
    distance_min: 1.94
    distance_max: 2.29
    # Zn-O first shell ends 2.238 A, second starts 3.420 A.
    cutoff: 2.829
  - atom1: H
    atom2: O
    # Reference O-H 0.978 A (all four H).
    distance_min: 0.95
    distance_max: 1.00
    # The next O is the hydrogen-bond acceptor at 2.323 A.
    cutoff: 1.650

angle_constraints:
  - atom_center: As
    atom_neighbor: O
    # Cited band; the reference realises 105.8-112.5 deg.
    angle_min: 100.0
    angle_max: 120.0
    angle_cutoff: 2.435
    weight: 1.0
  - atom_center: Zn
    atom_neighbor: O
    # Zn1 is a trigonal bipyramid, whose equatorial angles legitimately
    # exceed 120 deg. The reference realises 75.1-124.6 deg.
    angle_min: 75.0
    angle_max: 130.0
    angle_cutoff: 2.829
    weight: 1.0
  - atom_center: O
    # Cation-anion-cation bridging, stated explicitly with [Zn, As] rather
    # than X: X would include H, and the hydrogen bond O...H (2.323 A) lies
    # only 0.085 A beyond the longest Zn-O bond (2.238 A), so no cutoff can
    # separate a shell that includes H (ADR-0025).
    atom_neighbor: [Zn, As]
    angle_min: 80.0
    angle_max: 160.0
    angle_cutoff: 2.690
    weight: 1.0

coordination_constraints:
  # O-cation shell over [Zn, As], for the reason stated on the O-centred
  # angle above. First shell ends 2.238 A, second starts 3.142 A.
  - center_atom: O
    neighbor_atom: [Zn, As]
    cn_min: 2
    cn_max: 4
    cutoff_distance: 2.690
    weight: 1.0
  - center_atom: As
    neighbor_atom: O
    cn_min: 4
    cn_max: 4
    cutoff_distance: 2.435
    weight: 1.5
  - center_atom: Zn
    neighbor_atom: O
    cn_min: 5
    cn_max: 6
    cutoff_distance: 2.829
    weight: 1.5
  # A hydroxyl H bonds one O.
  - center_atom: H
    neighbor_atom: O
    cn_min: 1
    cn_max: 1
    cutoff_distance: 1.650
    weight: 1.5
  # Polymerisation (uniqueness plan phase C): isolated AsO4 plus hydroxyl,
  # {0: 4, 1: 16}.
  - center_atom: O
    neighbor_atom: As
    cn_min: 0
    cn_max: 1
    cutoff_distance: 2.435
    weight: 1.0
  # One H per hydroxyl O and none on the arsenate O, {0: 16, 1: 4}: a
  # second H on one O would model a water molecule, not (OH).
  - center_atom: O
    neighbor_atom: H
    cn_min: 0
    cn_max: 1
    cutoff_distance: 1.650
    weight: 1.0

# The constraints above state every anion-centred shell explicitly over
# [Zn, As]; augment_coupling_constraints would otherwise add an O(X) pair
# whose X includes H (ADR-0025).
auto_anion_coupling: false

# Cell volume from the measured density, D(meas.) = 4.32-4.48 g/cm^3 (Handbook of
# Mineralogy, Anthony et al., eds., Mineralogical Society of America;
# references/adamite.pdf): V = Z M / (rho N_A) with Z = 4, M(Zn2AsO5H) from IUPAC 2021
# atomic weights (scripts/density_to_volume.py). D(calc.) is not used.
volume_constraint:
  volume_min: 425.04
  volume_max: 440.79
# Bond-valence sums (Brese & O'Keeffe 1991 R0, b = 0.37 A; ADR-0016). The
# cited 0.1 v.u. tolerance is exceeded at this fixture's own reference, so
# it is replaced by the measured deviation rounded outward (ADR-0004's
# amendment): As 4.474 against 5 (PBE lengthens As-O by about 0.03 A, the
# functional's error ADR-0025 accepts), Zn 2.087-2.209 against 2. H scores
# 0.927 and keeps the cited 0.1.
bond_valence:
  tolerance: {As: 0.53, Zn: 0.21}

tree_search:
  max_sites: 9
  max_formula_units: 4
  # feasibility_shortlist left unset deliberately: rank_by_feasibility_
  # staged's cost-aware default (Phase B-3.2/B-3.4) sizes it from real
  # measured per-candidate cost rather than a fixed guess -- see the
  # mizuho-py-wychoff-position plan's Phase B-3 section.
  #
  # max_candidates deliberately left UNSET: it doubles as BOTH
  # wyckoff_tree_search's own raw search budget (how many leaves the
  # best-first algorithm accepts before stopping) AND, via pipeline.py's
  # shared default lookup, search_and_rank's post-ranking Phase-2
  # truncation count -- setting it small here would starve the raw
  # search itself, not just bound Phase 2's cost, and defeat
  # tests/integration/test_pipeline_adamite.py's own point (finding
  # adamite's real multi-site topology needs the FULL search; only the
  # FINAL, post-ranking truncation should be small, and that test
  # controls it directly via search_and_rank's own function argument
  # instead of this key).

optimization:
  n_restarts: 8
  cma_maxiter: 300
  refine_maxiter: 400
  seed: 42
