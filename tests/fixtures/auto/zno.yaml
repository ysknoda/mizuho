# ZnO, automatic space-group search. Expected detected group 186 or its
# polytype 216 (zinc blende): first-shell constraints cannot tell them apart.
# Opt-in required since ADR-0021.
#
# Derived constraints (ADR-0028, ADR-0030): composition, charges and the
# cited Zn coordination number only.
# Density: D(meas.) = 5.66(2) g/cm^3 as zincite (Handbook of Mineralogy;
# references/zincite.pdf, as tests/fixtures/wurtzite_zno.yaml, ADR-0017):
# V/fu 23.79-23.96 A^3.
mode: auto_spacegroup
composition: ZnO
ionic_charges: {Zn: 2, O: -2}
charge_tolerance_min: 0
charge_tolerance_max: 0
coordination_numbers: {Zn: 4}
density_g_cm3: [5.64, 5.68]
tree_search: {max_sites: 4, max_formula_units: 4}
optimization: {n_restarts: 4, cma_maxiter: 150, refine_maxiter: 200, seed: 42}
