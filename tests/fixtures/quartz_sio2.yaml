# Alpha-quartz SiO2, space group 152 (P3_121), Z = 3. Trigonal P lattice
# with a screw axis; its enantiomorph is P3_221 (154).
# Reference: tests/fixtures/reference/quartz_sg152.cif (COD 1011097,
# a = 4.913, c = 5.404 A; special positions rounded, idealised at 1e-3 A).
#
# Cited coordination numbers: Si 4 (tetrahedral), O 2 (bridging). Values
# measured at the reference (ADR-0004, ADR-0007): Si-O first shell
# 1.614-1.624 A, second shell from 3.488 A.
#
# Charge balance: Si(+4) + 2*O(-2) = 0.
composition: SiO2
spacegroup: 152
spacegroup_symbol: P3_121

ionic_charges:
  Si: 4
  O: -2

charge_tolerance_min: 0
charge_tolerance_max: 0

lattice_bounds:
  a: [4.3, 5.5]
  c: [4.7, 6.1]

bond_constraints:
  - atom1: Si
    atom2: O
    # Span 1.614-1.624 A widened by 2% (ADR-0007).
    distance_min: 1.58
    distance_max: 1.66
    cutoff: 2.556
    weight: 1.0

angle_constraints:
  - atom_center: Si
    atom_neighbor: O
    # Measured 108.32-110.89 deg.
    angle_min: 105.0
    angle_max: 115.0
    angle_cutoff: 2.556
    weight: 1.5

coordination_constraints:
  - center_atom: Si
    neighbor_atom: O
    cn_min: 4
    cn_max: 4
    cutoff_distance: 2.556
    weight: 1.5
  - center_atom: O
    neighbor_atom: X
    cn_min: 2
    cn_max: 2
    cutoff_distance: 2.556
    weight: 1.0

# Cutoff for the auto X-O-X angle constraint injected beside the explicit
# O(X) coordination constraint: the same measured O cutoff (ADR-0004).
auto_coupling_cutoff: 2.556

# Cell volume from the measured density, D(meas.) = 2.65 (2.59–2.63 when massive; the crystal value is used), +-2% g/cm^3 (Handbook of
# Mineralogy, Anthony et al., eds., Mineralogical Society of America;
# references/quartz.pdf): V = Z M / (rho N_A) with Z = 3, M(SiO2) from IUPAC 2021
# atomic weights (scripts/density_to_volume.py). D(calc.) is not used.
volume_constraint:
  volume_min: 110.73
  volume_max: 115.26

tree_search:
  max_sites: 4
  max_formula_units: 3

optimization:
  n_restarts: 6
  cma_maxiter: 250
  refine_maxiter: 300
  seed: 42
