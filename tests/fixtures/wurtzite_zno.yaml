# Wurtzite ZnO, space group 186 (P6_3mc), Z = 2. Hexagonal, polar: z has
# a floating origin (ADR-0011).
# Reference: tests/fixtures/reference/wurtzite.cif (COD 1577381,
# a = 3.251, c = 5.209 A, u = 0.3823; special positions rounded to
# 0.3333 / 0.6667, idealised at 1e-3 A).
#
# Cited coordination numbers: Zn 4, O 4 (tetrahedral). Values measured at
# the reference (ADR-0004, ADR-0007): Zn-O 1.975 x3 / 1.991 A, second
# shell from 3.218 A.
#
# Charge balance: Zn(+2) + O(-2) = 0.
composition: ZnO
spacegroup: 186
spacegroup_symbol: P6_3mc

ionic_charges:
  Zn: 2
  O: -2

charge_tolerance_min: 0
charge_tolerance_max: 0

lattice_bounds:
  a: [2.9, 3.6]
  c: [4.6, 5.8]

bond_constraints:
  - atom1: Zn
    atom2: O
    # Span 1.975-1.991 A widened by 2% (ADR-0007).
    distance_min: 1.93
    distance_max: 2.04
    cutoff: 2.604
    weight: 1.0

angle_constraints:
  - atom_center: Zn
    atom_neighbor: O
    # Measured 108.09-110.82 deg.
    angle_min: 105.0
    angle_max: 115.0
    angle_cutoff: 2.604
    weight: 1.5

coordination_constraints:
  - center_atom: Zn
    neighbor_atom: O
    cn_min: 4
    cn_max: 4
    cutoff_distance: 2.604
    weight: 1.5
  - center_atom: O
    neighbor_atom: X
    cn_min: 4
    cn_max: 4
    cutoff_distance: 2.604
    weight: 1.0

# Cutoff for the auto X-O-X angle constraint injected beside the explicit
# O(X) coordination constraint: the same measured O cutoff (ADR-0004).
auto_coupling_cutoff: 2.604

# Cell volume from the measured density, D(meas.) = 5.66(2), as zincite g/cm^3 (Handbook of
# Mineralogy, Anthony et al., eds., Mineralogical Society of America;
# references/zincite.pdf): V = Z M / (rho N_A) with Z = 2, M(ZnO) from IUPAC 2021
# atomic weights (scripts/density_to_volume.py). D(calc.) is not used.
volume_constraint:
  volume_min: 47.58
  volume_max: 47.92

tree_search:
  max_sites: 4
  max_formula_units: 2

optimization:
  n_restarts: 6
  cma_maxiter: 250
  refine_maxiter: 300
  seed: 42
