# CsCl structure, space group 221 (Pm-3m).
# Exercises the HARD_RADII table entry for Cs (previously missing --
# see the element-property-table fix in the Phase 1 bug list).
composition: CsCl
spacegroup: 221
spacegroup_symbol: Pm-3m

ionic_charges:
  Cs: 1
  Cl: -1

charge_tolerance_min: 0
charge_tolerance_max: 0

lattice_bounds:
  a: [3.5, 5.5]

bond_constraints:
  - atom1: Cs
    atom2: Cl
    distance_min: 3.2
    distance_max: 3.8
    weight: 1.0

tree_search:
  max_sites: 4
  max_formula_units: 2

optimization:
  n_restarts: 2
  cma_maxiter: 50
  refine_maxiter: 100
  seed: 42
